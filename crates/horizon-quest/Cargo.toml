[package]
name = "horizon-quest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The Meta Quest app: android_main for a NativeActivity, the game drawn through OpenXR (horizon-xr)"
publish = false

[lib]
name = "horizon_quest"
crate-type = ["cdylib"]

# Only Android builds anything: elsewhere the library is empty.
[target.'cfg(target_os = "android")'.dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-xr = { path = "../horizon-xr" }
# Unpacking the bundled runtime, downloading from Mojang and preparing, on the headset.
horizon-quest-launcher = { path = "../horizon-quest-launcher" }
horizon-account = { path = "../horizon-account" }
horizon-fetch = { path = "../horizon-fetch" }
# The data version an options file made from nothing is written with.
horizon-core = { path = "../horizon-core" }
# The NativeActivity glue (android-activity) behind winit's Android event loop.
winit = { version = "0.30.13", features = ["android-native-activity"] }
libc = "0.2"
# The process's Android context, which openxr hands to xrCreateInstance.
ndk-context = "0.1.1"
log = "0.4"

[features]
default = ["audio"]
# Sound through AAudio (cpal); off builds a silent game.
audio = ["horizon-client/audio"]
# A developer's build (packaging/quest/build_apk.sh with QUEST_DEV_NO_GATE=1) that can skip the
# ownership gate with the launch.txt line HORIZON_QUEST_NO_GATE=1, to check the download and the
# preparer with no account. Never on in a normal build.
dev-no-gate = ["horizon-quest-launcher/dev-no-gate"]

[lints]
workspace = true
