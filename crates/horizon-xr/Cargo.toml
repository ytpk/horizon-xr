[package]
name = "horizon-xr"
version = "0.1.0"
edition.workspace = true
# Holds code derived from Vivecraft (LGPL-3.0-or-later); see LICENSE-LGPL-3.0 and THIRD_PARTY_NOTICES.md.
license = "LGPL-3.0-or-later"
rust-version = "1.90"
description = "OpenXR for the renderer: the session, the eyes' swapchains, the controllers; the Vulkan and OpenXR calls the crates that forbid unsafe code can't make"

[dependencies]
horizon-client-input = { path = "../horizon-client-input" }
horizon-client-render = { path = "../horizon-client-render" }
horizon-vivecraft = { path = "../horizon-vivecraft" }
horizon-visor = { path = "../horizon-visor" }
# Loads libopenxr_loader.so at run time (bundled in the APK), so nothing links to it.
openxr = { version = "0.21", default-features = false, features = ["loaded"] }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
# The version wgpu-hal already uses.
ash = { version = "0.38", default-features = false }
glam = "0.30"
log = "0.4"

# Asking the activity for the tracking permissions (permission.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"

[lints]
workspace = true
