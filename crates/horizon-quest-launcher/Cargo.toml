[package]
name = "horizon-quest-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Quest's on-headset launcher logic, no GPU and no UI: unpack the bundled runtime, download the game from Mojang, prepare it (docs/quest-launcher-plan.md)"
publish = false

[dependencies]
horizon-account = { path = "../horizon-account" }
horizon-fetch = { path = "../horizon-fetch" }
horizon-prepare = { path = "../horizon-prepare" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The news read from GitHub's release list, as the desktop launcher reads it.
ureq = { version = "2", features = ["json", "tls"], default-features = false }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
crc32fast = "1"
log = "0.4"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Developer builds only (packaging/quest/build_apk.sh with QUEST_DEV_NO_GATE=1): the run-time
# switch HORIZON_QUEST_NO_GATE=1 then skips the ownership gate, to check download and prepare
# with no account. A normal build does not contain that code path at all.
dev-no-gate = []
