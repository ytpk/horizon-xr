[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
png = "0.18"
# The headset's poses (`headset`).
glam = "0.30"
# The VR settings table (`headset::settings`).
horizon-vivecraft = { path = "../horizon-vivecraft" }

[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

# The system clipboard; Android (the Quest build) has none arboard can reach: the game's own.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[features]
controllers = []

[lints]
workspace = true
