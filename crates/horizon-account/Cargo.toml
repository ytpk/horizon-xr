[package]
name = "horizon-account"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Microsoft sign-in for Minecraft (device code, Xbox, XSTS, ownership, profile) and where its secrets are kept; shared by the launcher and the Quest"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"], default-features = false }
# The secrets file is encrypted (store.rs, FileStore).
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.3"

# Native prismarine-auth Live/Xbox proof-of-possession.
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
url = "2"
